<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Dashboard - TCM 平台</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .dash-grid { grid-template-columns: 1fr; } }
  .dash-card h3 { margin: 0 0 14px; font-size: 15px; color: #1f4f37; }
  .host-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eef1ef; }
  .host-row:last-child { border-bottom: none; }
  .host-name { font-weight: 600; font-size: 14px; }
  .host-role { color: #6b7a70; font-size: 12px; }
  .host-detail { color: #8a958f; font-size: 11.5px; margin-top: 2px; }
  .version-badge { display: inline-block; background: #2f6f4f; color: #fff; border-radius: 6px; padding: 3px 10px; font-size: 13px; font-weight: 600; }
  .version-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eef1ef; font-size: 13px; }
  .version-item .v-tag { color: #2f6f4f; font-weight: 600; margin-right: 8px; white-space: nowrap; }
  .version-item .v-summary { color: #4a554e; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .version-item button { flex-shrink: 0; margin-left: 10px; padding: 3px 10px; font-size: 12px; }
  .version-list { max-height: 320px; overflow-y: auto; }
  .doc-list-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .doc-list-btns button { background: #fff; color: #2f6f4f; border: 1px solid #2f6f4f; padding: 8px 16px; }
  .goal-item { padding: 10px 0; border-bottom: 1px solid #eef1ef; font-size: 13.5px; }
  .goal-item:last-child { border-bottom: none; }
  .goal-title { font-weight: 600; }
  .goal-status-done { color: #2f6f4f; }
  .goal-status-pending { color: #b8860b; }
  .markdown-body { font-size: 13.5px; line-height: 1.7; color: #24312a; max-height: 65vh; overflow-y: auto; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: #1f4f37; margin-top: 18px; }
  .markdown-body code { background: #f0f3f1; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .markdown-body pre { background: #f0f3f1; padding: 10px; border-radius: 6px; overflow-x: auto; }
  .markdown-body table { border-collapse: collapse; width: 100%; margin: 10px 0; }
  .markdown-body th, .markdown-body td { border: 1px solid #dfe5e0; padding: 6px 8px; font-size: 12.5px; }
  #docModal .modal, #versionDetailModal .modal { max-width: 720px; width: 92%; max-height: 82vh; }
  .full-modal-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .dash-card a.link { color: #2f6f4f; text-decoration: none; font-weight: 600; }
  .dash-card a.link:hover { text-decoration: underline; }
</style>
</head>
<body data-current-page="dashboard.html">
<div class="layout">
  <aside class="sidebar">
    <h1>TCM 中藥腫瘤篩選平台</h1>
    <nav id="navContainer"></nav>
  </aside>
  <main class="main">
    <div class="topbar">
      <h2 style="margin:0;">Dashboard</h2>
      <div class="user-info" id="userInfo"></div>
    </div>

    <div class="dash-grid">
      <div class="card dash-card" id="cardHosts">
        <h3>🖥️ 主機資訊</h3>
        <div id="hostsList">載入中...</div>
      </div>

      <div class="card dash-card" id="cardVersion">
        <h3>🏷️ 版本資訊　<span class="version-badge" id="currentVersionBadge">v...</span></h3>
        <div class="version-list" id="versionList">載入中...</div>
      </div>

      <div class="card dash-card" id="cardDocs">
        <h3>📄 專案文件</h3>
        <div class="doc-list-btns" id="docList">載入中...</div>
      </div>

      <div class="card dash-card" id="cardGoals">
        <h3>🎯 2026 年工作目標</h3>
        <div id="goalsList">載入中...</div>
        <div style="margin-top:10px; text-align:right;">
          <button class="secondary" onclick="openDoc('goals2026')">查看完整文件</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 版本詳細內容 Modal -->
<div id="versionDetailModal" class="modal-backdrop" style="display:none;">
  <div class="modal">
    <div class="full-modal-title">
      <h3 id="versionDetailTitle" style="margin:0;"></h3>
      <button class="secondary" onclick="closeVersionDetail()">✕ 關閉</button>
    </div>
    <div class="markdown-body" id="versionDetailBody"></div>
  </div>
</div>

<!-- 文件內容 Modal -->
<div id="docModal" class="modal-backdrop" style="display:none;">
  <div class="modal">
    <div class="full-modal-title">
      <h3 id="docModalTitle" style="margin:0;"></h3>
      <button class="secondary" onclick="closeDoc()">✕ 關閉</button>
    </div>
    <div class="markdown-body" id="docModalBody"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
