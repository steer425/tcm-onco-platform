<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>暗黑基因統計 - TCM 平台</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
<style>
  .stat-cards { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 20px; min-width: 140px; }
  .stat-card b { display: block; font-size: 26px; }
  .stat-card span { font-size: 12px; color: var(--muted); }
  table.stats-table th { cursor: pointer; user-select: none; }
  table.stats-table th:hover { color: var(--primary); }
  table.stats-table th .sort-arrow { font-size: 10px; margin-left: 3px; color: var(--muted); }
  .clickable-num { color: var(--primary); font-weight: 600; cursor: pointer; text-decoration: underline; }
  .clickable-num:hover { opacity: 0.7; }
  .gene-type-pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .type-oncogene { background:#fdecea; color:#a83232; }
  .type-tsg { background:#e3ecf5; color:#1c4d78; }
  .type-both { background:#f5ecdc; color:#7a5420; }
  .type-neither, .type-insufficient, .type-unclassified { background:#eee; color:#888; }
  .breadcrumb { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .breadcrumb a { color: var(--primary); text-decoration: none; cursor: pointer; }
  .breadcrumb a:hover { text-decoration: underline; }
  #drilldownSection, #herbSection { display: none; margin-top: 18px; }
  .gene-item-row, .herb-item-row { cursor: pointer; }
  .gene-item-row:hover td, .herb-item-row:hover td { background: #f0f3f1; }
</style>
</head>
<body data-current-page="darkgene-stats.html">
<div class="layout">
  <aside class="sidebar">
    <h1>TCM 中藥腫瘤篩選平台</h1>
    <nav id="navContainer"></nav>
  </aside>
  <main class="main">
    <div class="topbar">
      <h2 style="margin:0;">暗黑基因統計</h2>
      <div class="user-info" id="userInfo"></div>
    </div>

    <div class="card">
      <p class="hint-msg" style="margin-top:0;">
        以基因（Hugo Symbol）為主要清單，統計每個基因比對到幾個 TCMSP 靶點、連結到幾種候選中藥材。點欄位名稱可以排序，點藍色數字可以下鑽看清單。
      </p>
      <div class="stat-cards">
        <div class="stat-card"><b id="statTotal">-</b><span>基因總數</span></div>
        <div class="stat-card"><b id="statWithTarget">-</b><span>有中藥靶點</span></div>
        <div class="stat-card"><b id="statWithoutTarget">-</b><span>無中藥靶點</span></div>
      </div>
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
        <input id="geneSearchInput" placeholder="搜尋 Hugo Symbol / 別名" style="max-width:220px;" />
        <label style="display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted);">
          <input type="checkbox" id="onlyWithTargetFilter" checked> 只顯示有中藥靶點的基因
        </label>
        <span class="hint-msg" id="geneCountHint" style="margin-left:auto;"></span>
      </div>

      <table class="stats-table" id="statsTable">
        <thead>
          <tr>
            <th data-sort="hugo_symbol">Hugo Symbol <span class="sort-arrow"></span></th>
            <th data-sort="gene_type">Gene Type <span class="sort-arrow"></span></th>
            <th data-sort="target_count">靶點統計 <span class="sort-arrow"></span></th>
            <th data-sort="herb_count">中藥統計 <span class="sort-arrow"></span></th>
            <th data-sort="entrez_gene_id">Entrez ID <span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="statsBody"></tbody>
      </table>
    </div>

    <div class="card" id="drilldownSection">
      <div class="breadcrumb" id="drilldownBreadcrumb"></div>
      <h3 id="drilldownTitle" style="margin-top:0;"></h3>
      <table>
        <thead id="drilldownHead"></thead>
        <tbody id="drilldownBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/i18n-dict.js"></script>
<script src="js/site-lang.js"></script>
<script src="js/darkgene-stats.js"></script>
</body>
</html>
