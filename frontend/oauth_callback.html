<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2745%27 fill=%27%232f5c8a%27/%3E%3Ctext x=%2750%27 y=%2768%27 font-size=%2760%27 text-anchor=%27middle%27 fill=%27white%27%3E%E8%97%A5%3C/text%3E%3C/svg%3E" />
<title>登入中... - TCM 平台</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body>
<div class="login-wrap">
  <div class="login-card" style="text-align:center;">
    <h2>登入處理中...</h2>
    <p style="color:#6b7a70; font-size:13px;">正在完成 Google 登入，請稍候。</p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
(() => {
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  const loginLogId = params.get("login_log_id");
  const error = params.get("error");

  if (token) {
    setSession(token, loginLogId || "");
    window.location.href = "dashboard.html";
    return;
  }

  const errorCode = error || "unknown";
  window.location.href = "index.html?google_error=" + encodeURIComponent(errorCode);
})();
</script>
</body>
</html>
