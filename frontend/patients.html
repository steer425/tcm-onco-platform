<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2745%27 fill=%27%232f5c8a%27/%3E%3Ctext x=%2750%27 y=%2768%27 font-size=%2760%27 text-anchor=%27middle%27 fill=%27white%27%3E%E8%97%A5%3C/text%3E%3C/svg%3E" />
<title>客戶資料管理 - TCM 平台</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
<style>
  .id-number-cell { font-family: monospace; }
  .id-number-cell button { padding: 1px 6px; font-size: 11px; margin-left: 6px; }
  .encounter-panel { margin-top: 8px; padding: 12px; background: #f7f9f7; border-radius: 8px; border: 1px solid var(--border); }
  .encounter-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .encounter-row:last-child { border-bottom: none; }
  .status-pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:600; }
  .status-active { background:#e8f3ec; color:#1f4f37; }
  .status-inactive { background:#fdecea; color:#c0392b; }
</style>
</head>
<body data-current-page="patients.html">
<div class="layout">
  <aside class="sidebar">
    <h1>TCM 中藥腫瘤篩選平台</h1>
    <nav id="navContainer"></nav>
  </aside>
  <main class="main">
    <div class="topbar">
      <h2 style="margin:0;">客戶資料管理</h2>
      <div class="user-info" id="userInfo"></div>
    </div>

    <div class="card">
      <p class="hint-msg" style="margin-top:0;">
        病患基本資料欄位命名參照中國國家衛健委《電子病歷基本數據集》標準。<b>證件號碼一律遮罩顯示</b>，需要點「顯示明碼」才會看到完整號碼，且會記錄稽核紀錄。
        本頁面對應「病患」與「就診」兩層資料；檢體／定序／分析／變異／解讀／品質等基因體資料層規劃於後續版本擴充（詳見
        <a href="architecture.html">系統架構規劃</a>）。
      </p>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px;">
        <input id="searchInput" placeholder="搜尋姓名/病患識別碼/病歷號" style="max-width:260px;" />
        <select id="statusFilter" style="max-width:140px;">
          <option value="">全部</option>
          <option value="active">使用中</option>
          <option value="inactive">已刪除</option>
        </select>
        <button id="newBtn" style="margin-left:auto;">＋ 新增病患</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>病患識別碼</th><th>姓名</th><th>性別</th><th>出生日期</th>
            <th>證件號碼</th><th>病歷號</th><th>就診次數</th><th>狀態</th><th style="width:160px;">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>
</div>

<div id="patientModal" class="modal-backdrop" style="display:none;">
  <div class="modal" style="max-width:640px;">
    <h3 id="patientModalTitle">新增病患</h3>
    <input type="hidden" id="patId" />
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <div><label>病患識別碼 *</label><input id="patPatientId" /></div>
      <div><label>姓名 *</label><input id="patName" /></div>
      <div><label>證件類型</label><input id="patIdType" placeholder="身分證/護照/居留證..." /></div>
      <div><label>證件號碼</label><input id="patIdNumber" /></div>
      <div><label>性別代碼</label><input id="patSex" placeholder="M/F/其他" /></div>
      <div><label>出生日期</label><input id="patBirth" type="date" /></div>
      <div><label>國籍代碼</label><input id="patNationality" /></div>
      <div><label>民族</label><input id="patEthnicity" /></div>
      <div><label>聯絡電話</label><input id="patPhone" /></div>
      <div><label>病歷號</label><input id="patMrn" /></div>
    </div>
    <label>現住址</label>
    <input id="patAddress" />
    <label>備注</label>
    <textarea id="patNotes" rows="2"></textarea>

    <div id="encounterSection" style="display:none;">
      <h4 style="margin-bottom:6px;">就診紀錄</h4>
      <div class="encounter-panel" id="encounterList">載入中...</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;">
        <input id="encId" placeholder="就診識別碼 *" />
        <input id="encDate" type="date" />
        <input id="encInstitution" placeholder="醫療機構" />
        <input id="encDept" placeholder="科別" />
        <input id="encDiagCode" placeholder="診斷代碼" />
        <input id="encDiagName" placeholder="診斷名稱" />
      </div>
      <button type="button" id="addEncounterBtn" class="secondary" style="margin-top:6px;">＋ 新增就診紀錄</button>
      <p class="hint-msg">新增病患時請先「儲存」，儲存後才能新增就診紀錄。</p>
    </div>

    <div style="margin-top:16px; display:flex; gap:10px; justify-content:flex-end;">
      <button class="secondary" id="patientModalCancel">關閉</button>
      <button id="patientModalSave">儲存</button>
    </div>
    <div id="patientModalMsg" class="hint-msg"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/i18n-dict.js"></script>
<script src="js/site-lang.js"></script>
<script src="js/patients.js"></script>
</body>
</html>
