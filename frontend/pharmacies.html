<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2745%27 fill=%27%232f5c8a%27/%3E%3Ctext x=%2750%27 y=%2768%27 font-size=%2760%27 text-anchor=%27middle%27 fill=%27white%27%3E%E8%97%A5%3C/text%3E%3C/svg%3E" />
<title>中藥行管理 - TCM 平台</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
</head>
<body data-current-page="pharmacies.html">
<div class="layout">
  <aside class="sidebar">
    <h1>TCM 中藥腫瘤篩選平台</h1>
    <nav id="navContainer"></nav>
  </aside>
  <main class="main">
    <div class="topbar">
      <h2 style="margin:0;">中藥行管理（後台）</h2>
      <div class="user-info" id="userInfo"></div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <input id="searchInput" placeholder="搜尋中藥行名稱" style="max-width:240px;" />
        <button id="newBtn">＋ 新增中藥行</button>
      </div>
      <table>
        <thead>
          <tr><th>名稱</th><th>地址</th><th>電話</th><th>狀態</th><th>評價</th><th>備注</th><th style="width:220px;">操作</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>
</div>

<div id="pharmacyModal" class="modal-backdrop" style="display:none;">
  <div class="modal">
    <h3 id="modalTitle">新增中藥行</h3>
    <input type="hidden" id="pharmacyId" />
    <label>名稱</label>
    <input id="fName" />
    <label>地址</label>
    <input id="fAddress" />
    <label>電話</label>
    <input id="fPhone" />
    <label>營業時間（文字說明）</label>
    <input id="fHours" placeholder="例如 09:00-18:00（週日休）" />
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <div><label>開始營業（用於「營業狀態」判斷）</label><input id="fOpensAt" type="time" /></div>
      <div><label>結束營業</label><input id="fClosesAt" type="time" /></div>
    </div>
    <label>緯度 Latitude</label>
    <input id="fLat" type="number" step="any" placeholder="例如 25.0330" />
    <label>經度 Longitude</label>
    <input id="fLng" type="number" step="any" placeholder="例如 121.5654" />
    <label>簡介</label>
    <textarea id="fDesc" rows="2"></textarea>
    <label>狀態</label>
    <select id="fStatus">
      <option value="active">上架</option>
      <option value="inactive">下架</option>
    </select>
    <label>備注</label>
    <textarea id="fNotes" rows="2"></textarea>

    <h4 style="margin-bottom:6px; margin-top:18px;">店家功能</h4>
    <label>開幕日期（用於「最新開幕」排序，留空則以資料建立時間為準）</label>
    <input id="fOpeningDate" type="date" />
    <div style="display:grid; grid-template-columns:1fr 2fr; gap:10px;">
      <div><label>折扣幅度（%）</label><input id="fDiscountPercent" type="number" min="0" max="100" placeholder="例如 20" /></div>
      <div><label>優惠說明</label><input id="fDiscountDesc" placeholder="例如 滿千折兩百 / 全館8折" /></div>
    </div>
    <label>優惠期限（留空代表長期有效）</label>
    <input id="fDiscountUntil" type="date" />

    <p class="hint-msg">
      不確定經緯度？可以到 Google 地圖上右鍵點選地點，選單第一行會顯示座標，複製貼上即可。
    </p>
    <div style="margin-top:16px; display:flex; gap:10px; justify-content:flex-end;">
      <button class="secondary" id="modalCancel">取消</button>
      <button id="modalSave">儲存</button>
    </div>
    <div id="modalMsg" class="hint-msg"></div>
  </div>
</div>

<div id="reviewsModal" class="modal-backdrop" style="display:none;">
  <div class="modal">
    <h3>評價管理：<span id="reviewsPharmacyName"></span></h3>
    <table>
      <thead><tr><th>帳號</th><th>星等</th><th>內容</th><th>備注</th><th></th></tr></thead>
      <tbody id="reviewsBody"></tbody>
    </table>
    <div style="margin-top:16px; text-align:right;">
      <button class="secondary" id="reviewsClose">關閉</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/i18n-dict.js"></script>
<script src="js/site-lang.js"></script>
<script src="js/pharmacies.js"></script>
</body>
</html>
