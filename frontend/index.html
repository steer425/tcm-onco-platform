<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2745%27 fill=%27%232f5c8a%27/%3E%3Ctext x=%2750%27 y=%2768%27 font-size=%2760%27 text-anchor=%27middle%27 fill=%27white%27%3E%E8%97%A5%3C/text%3E%3C/svg%3E" />
<title>TCM Oncology Herb Screening Platform - Login</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
<script src="js/i18n-dict.js"></script>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div style="display:flex; justify-content:flex-end; margin-bottom:6px;">
      <select id="langSelect" style="width:140px; margin:0; font-size:12.5px;">
        <option value="en">English</option>
        <option value="tw">繁體中文</option>
        <option value="cn">简体中文</option>
        <option value="ko">한국어</option>
      </select>
    </div>
    <h2>TCM 中藥腫瘤篩選平台</h2>
    <p style="color:#6b7a70;font-size:13px;margin:0;">後台管理系統登入</p>

    <form id="loginForm">
      <label for="account">帳號</label>
      <input id="account" required autocomplete="username" />

      <label for="password">密碼</label>
      <input id="password" type="password" required autocomplete="current-password" />

      <div style="margin-top:20px; display:flex; gap:10px;">
        <button type="submit" style="flex:1;">登入</button>
        <button type="button" class="secondary" id="applyBtn" style="flex:1;">申請新帳號</button>
      </div>
    </form>
    <div id="googleLoginWrap" style="display:none; margin-top:14px;">
      <div style="text-align:center; color:#9aa5a0; font-size:12px; margin:10px 0;">— 或 —</div>
      <button type="button" id="googleLoginBtn" style="width:100%; background:#fff; color:#3c4043; border:1px solid #dadce0;">
        使用 Google 帳號登入
      </button>
    </div>
    <div id="facebookLoginWrap" style="display:none; margin-top:10px;">
      <button type="button" id="facebookLoginBtn" style="width:100%; background:#1877f2; color:#fff; border:1px solid #1877f2;">
        使用 Facebook 帳號登入
      </button>
    </div>
    <div id="thirdPartyLoginHint" style="display:none; text-align:center; color:#9aa5a0; font-size:11.5px; margin-top:10px;">
      第三方登入服務啟動中，請稍候（免費方案伺服器閒置後需要喚醒，最長約 1 分鐘）...
    </div>
    <div id="errorMsg" class="error-msg"></div>
    <p class="hint-msg">測試帳號：admin / 0000（僅供本機測試，正式環境請務必更改密碼）</p>
  </div>
</div>

<!-- 申請新帳號 Modal -->
<div id="applyModal" class="modal-backdrop" style="display:none;">
  <div class="modal">
    <h3>申請新帳號</h3>
    <label>帳號</label>
    <input id="applyAccount" />
    <label>密碼</label>
    <input id="applyPassword" type="password" />
    <label>備注（選填）</label>
    <textarea id="applyNotes" rows="3"></textarea>
    <div style="margin-top:16px; display:flex; gap:10px; justify-content:flex-end;">
      <button class="secondary" id="applyCancel">取消</button>
      <button id="applySubmit">送出申請</button>
    </div>
    <div id="applyMsg" class="hint-msg"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
