<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2745%27 fill=%27%232f5c8a%27/%3E%3Ctext x=%2750%27 y=%2768%27 font-size=%2760%27 text-anchor=%27middle%27 fill=%27white%27%3E%E8%97%A5%3C/text%3E%3C/svg%3E" />
<title>帳號審核 - TCM 平台</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
</head>
<body data-current-page="applications.html">
<div class="layout">
  <aside class="sidebar">
    <h1>TCM 中藥腫瘤篩選平台</h1>
    <nav id="navContainer"></nav>
  </aside>
  <main class="main">
    <div class="topbar">
      <h2 style="margin:0;">帳號申請審核</h2>
      <div class="user-info" id="userInfo"></div>
    </div>

    <div class="card">
      <select id="statusFilter" style="max-width:160px; margin-bottom:14px;">
        <option value="pending">審核中</option>
        <option value="approved">已核准</option>
        <option value="rejected">已駁回</option>
        <option value="">全部</option>
      </select>
      <table>
        <thead>
          <tr><th>申請帳號</th><th>狀態</th><th>備注</th><th>申請時間</th><th style="width:220px;">操作</th></tr>
        </thead>
        <tbody id="appTableBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/i18n-dict.js"></script>
<script src="js/site-lang.js"></script>
<script src="js/applications.js"></script>
</body>
</html>
