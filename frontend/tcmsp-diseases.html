<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>疾病中文名稱管理 - TCM 平台</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
<style>
  input.cn-name-input { width: 200px; }
  .status-pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:600; }
  .status-has { background:#e8f3ec; color:#1f4f37; }
  .status-missing { background:#fdf3e0; color:#8a5a00; }
</style>
</head>
<body data-current-page="tcmsp-diseases.html">
<div class="layout">
  <aside class="sidebar">
    <h1>TCM 中藥腫瘤篩選平台</h1>
    <nav id="navContainer"></nav>
  </aside>
  <main class="main">
    <div class="topbar">
      <h2 style="margin:0;">疾病中文名稱管理</h2>
      <div class="user-info" id="userInfo"></div>
    </div>

    <div class="card">
      <p class="hint-msg" style="margin-top:0;">
        對應「TCMSP 疾病關聯查詢站」左側清單的中文名稱來源。系統已預先帶入 116 筆常見疾病的中文翻譯，
        其餘可在此逐步補充/修正；修正過的內容之後重新執行 TCMSP 資料匯入腳本也不會被洗掉。
      </p>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px;">
        <input id="searchInput" placeholder="搜尋疾病名稱（中/英文）或 Dis ID" style="max-width:260px;" />
        <label style="display:flex; align-items:center; gap:6px; font-size:13px; color:#6b7a70;">
          <input type="checkbox" id="missingOnlyFilter" /> 只顯示尚無中文名稱
        </label>
        <span class="hint-msg" id="countHint" style="margin-left:auto;"></span>
      </div>
      <table>
        <thead>
          <tr><th>Dis ID</th><th>英文名稱</th><th>中文名稱</th><th>狀態</th><th>備注</th><th style="width:100px;">操作</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/site-lang.js"></script>
<script src="js/tcmsp-diseases.js"></script>
</body>
</html>
