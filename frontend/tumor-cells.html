<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2745%27 fill=%27%233a9d63%27/%3E%3Ctext x=%2750%27 y=%2768%27 font-size=%2760%27 text-anchor=%27middle%27 fill=%27white%27%3E%E7%B4%B0%3C/text%3E%3C/svg%3E" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>腫瘤細胞株依賴查詢站</title>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
<script src="js/zh-match.js"></script>
<script src="js/i18n-dict.js"></script>
<script src="js/site-lang.js"></script>
<style>
:root{--bg:#0f1115;--panel:#171a20;--line:#2a2d34;--muted:#8a8f98;--herb:#c99a3d;--mol:#3b82c4;--tgt:#3a9d63;--warn:#c99a3d;--bad:#c0533e;}
html,body{margin:0;padding:0;background:var(--bg);color:#eee;font-family:"Noto Sans TC","Helvetica Neue",Arial,sans-serif;}
#platformNav{display:flex;align-items:center;gap:16px;padding:8px 22px;background:#20303f;border-bottom:1px solid var(--line);font-size:12.5px;flex-wrap:wrap;}
#platformNav a{color:#8fc3ea;text-decoration:none;}
#platformNav a:hover{text-decoration:underline;}
#platformNav span{color:var(--muted);}
#header{padding:14px 22px 10px;border-bottom:1px solid var(--line);}
#header h1{margin:0 0 4px;font-size:18px;font-weight:600;}
#header p{margin:0;font-size:12px;color:var(--muted);line-height:1.6;max-width:96ch;}
#layout{display:flex;height:calc(100vh - 128px);min-height:600px;}
#herbPanel{width:300px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;}
#herbSearch{margin:10px;padding:8px 10px;background:#1c1f26;border:1px solid #3a3d44;color:#eee;border-radius:6px;font-size:13px;}
#herbStats{padding:0 12px 6px;font-size:11.5px;color:var(--muted);}
#herbList{flex:1;overflow-y:auto;border-top:1px solid var(--line);}
.herbRow{padding:8px 12px;border-bottom:1px solid #1e2128;cursor:pointer;font-size:12.5px;}
.herbRow:hover{background:#1a1d23;}
.herbRow.active{background:#20303f;}
.herbRow .name{font-weight:600;}
.herbRow .meta{color:var(--muted);font-size:11px;}
#main{flex:1;display:flex;flex-direction:column;min-width:0;overflow-y:auto;}
#herbHeader{padding:14px 20px 4px;}
#herbHeader h2{margin:0 0 4px;font-size:17px;}
#herbHeader .meta{color:var(--muted);font-size:12.5px;}
#emptyState{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px;}
.kpi{display:flex;gap:12px;padding:12px 20px;flex-wrap:wrap;}
.kpi div{background:#1c1f26;border:1px solid #2a2d34;border-radius:10px;padding:10px 16px;min-width:108px;}
.kpi b{display:block;font-size:20px;}
.kpi span{font-size:11px;color:var(--muted);}
.kpi .hero b{color:var(--herb);}
#toolbar{display:flex;gap:8px;padding:8px 20px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);}
button{background:#26292f;border:1px solid #3a3d44;color:#eee;padding:6px 11px;border-radius:6px;font-size:12px;cursor:pointer;}
button:hover{background:#31353c;}
button.on{background:#2f5c8a;border-color:#3d70a3;}
#tableWrap{flex:1;overflow:auto;padding:8px 16px 16px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{position:sticky;top:0;background:#1c1f26;text-align:left;padding:7px 8px;color:#bcd;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:6px 8px;border-bottom:1px solid #23262c;vertical-align:top;}
tr:hover td{background:#171a20;}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
a.code{color:#8fc3ea;text-decoration:none;font-family:ui-monospace,Menlo,monospace;border-bottom:1px dotted #4d6b86;}
a.code:hover{color:#bcd;border-bottom-style:solid;}
.na{color:#666;font-style:italic;}
.small{font-size:11px;color:var(--muted);}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:600;white-space:nowrap;}
.st-auto,.st-confirmed{background:#173a27;color:#7fd3a3;}
.st-pending{background:#3a3016;color:#e3bf6b;}
.st-unresolved,.st-error{background:#3d211c;color:#e8968a;}
.st-rejected{background:#2c2f36;color:#9aa3ad;}
.st-untouched{background:#22262c;color:#7d868f;}
.tick{color:#7fd3a3;font-weight:700;}
.cross{color:#e8968a;font-weight:700;}
.delta-flag{color:var(--warn);font-weight:600;}
.disclaimer{background:#1c1f26;border:1px solid #3a3d44;border-radius:8px;padding:10px 14px;margin:12px 20px 16px;font-size:11.5px;color:var(--muted);line-height:1.7;}
.disclaimer b{color:#cfd6dd;}
a.term-link{color:#7db8e8;text-decoration:none;cursor:pointer;font-size:11px;vertical-align:super;margin-left:2px;}
a.term-link:hover{color:#a9d2f5;}
#termInfoModal{display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;background:rgba(0,0,0,.6);}
#termInfoBox{background:#171a20;border:1px solid #3a3d44;border-radius:12px;padding:20px 22px;max-width:440px;box-shadow:0 20px 50px rgba(0,0,0,.5);}
#termInfoBox h3{margin:0 0 10px;font-size:15px;color:#fff;}
#termInfoBox p{margin:0 0 14px;font-size:13px;line-height:1.7;color:#cbd5e1;white-space:pre-wrap;}
#langBar{margin-left:auto;display:flex;align-items:center;gap:6px;}
select{background:#1c1f26;color:#eee;border:1px solid #3a3d44;border-radius:6px;padding:4px 8px;font-size:12px;}
@media (max-width:820px){
  #layout{flex-direction:column;height:auto;}
  #herbPanel{width:auto;border-right:0;border-bottom:1px solid var(--line);}
  #herbList{max-height:220px;}
}
</style>
<style>
.tabs{display:flex;gap:6px;padding:8px 20px 0;flex-wrap:wrap;}
.tabs button.on{background:#2f5c8a;border-color:#3d70a3;}
#paramBar{display:flex;gap:10px;align-items:center;padding:8px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:12px;}
.funnel{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:4px 20px 10px;font-size:12px;color:var(--muted);}
.funnel b{color:#eee;}
.funnel .arrow{color:#555;}
.warn{color:var(--warn);font-weight:600;}
.eff-strong{color:#e8968a;font-weight:700;}
.eff-weak{color:#cfd6dd;}
.noise{color:#7d868f;}
.ingList{margin:4px 0 0;padding-left:16px;font-size:11px;color:var(--muted);}
.ingList li{margin:1px 0;}
a.gene{color:#8fd3a8;text-decoration:none;font-weight:600;cursor:pointer;border-bottom:1px dotted #4d866b;}
a.line{color:#8fc3ea;text-decoration:none;cursor:pointer;border-bottom:1px dotted #4d6b86;}
#detailModal{display:none;position:fixed;inset:0;z-index:9000;align-items:center;justify-content:center;background:rgba(0,0,0,.6);}
#detailBox{background:#171a20;border:1px solid #3a3d44;border-radius:12px;width:min(920px,94vw);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.5);}
#detailHead{padding:14px 18px 8px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;}
#detailHead h3{margin:0;font-size:15px;flex:1;}
#detailBody{overflow:auto;padding:10px 16px 16px;}
.attrib{font-size:11px;color:var(--muted);padding:6px 20px 14px;}
</style>
</head>
<body>

<div id="platformNav">
  <a href="index.html">← 回首頁</a>
  <span>|</span>
  <a href="tcmsp_query.html">中藥關聯查詢站</a>
  <a href="herb-ingredients.html">藥材活性成分</a>
  <a href="pathways.html">通路富集分析</a>
  <a href="darkgene_query.html">暗黑基因查詢站</a>
  <div id="langBar">
    <a href="personal-settings.html">個人化設定</a>
    <a href="#" id="platformLogout">登出</a>
    <span class="small">語言</span>
    <select id="uiLangSelect">
      <option value="tw">繁體中文</option>
      <option value="cn">简体中文</option>
      <option value="en">English</option>
      <option value="ko">한국어</option>
    </select>
  </div>
</div>

<div id="header">
  <h1>腫瘤細胞株依賴查詢站</h1>
  <p>
    藥材的活性成分 → 靶點 → <b>哪些靶點是特定腫瘤細胞株的選擇性依賴</b>（DepMap CRISPR 篩選）。
    先排除<b>泛必需基因</b>（命中它們是細胞毒性，不是抗腫瘤機轉），再以<b>選擇性當門檻、效應量當排序</b>。
    每一列都是一個可以被否證的驗證方案起點：具體基因、具體細胞株、具體癌別。
  </p>
</div>

<div id="layout">
  <div id="herbPanel">
    <input id="herbSearch" type="search" placeholder="搜尋藥材（中文／拼音／英文）…" autocomplete="off" />
    <div id="herbStats">載入中…</div>
    <div id="herbList"></div>
  </div>

  <div id="main">
    <div id="emptyState">請從左側選擇一味藥材。</div>
    <div id="detail" style="display:none;">
      <div id="herbHeader"></div>
      <div class="funnel" id="funnel"></div>
      <div class="kpi" id="kpi"></div>
      <div id="paramBar">
        <span>選擇性門檻</span>
        <select id="ratioSel">
          <option value="0.05">≤ 5% 的細胞株</option>
          <option value="0.1">≤ 10% 的細胞株</option>
          <option value="0.2" selected>≤ 20% 的細胞株（預設）</option>
        </select>
        <span class="small" id="paramNote"></span>
      </div>
      <div class="tabs" id="tabs">
        <button data-tab="gated" class="on">選擇性靶點</button>
        <button data-tab="dropped">被門檻刷掉</button>
        <button data-tab="essential">泛必需（已排除）</button>
      </div>
      <div id="tableWrap"><div id="tabBody"></div></div>
      <div class="disclaimer" id="disclaimer"></div>
      <div class="attrib" id="attrib"></div>
    </div>
  </div>
</div>

<div id="detailModal">
  <div id="detailBox">
    <div id="detailHead"><h3 id="detailTitle"></h3><button id="detailClose">✕ 關閉</button></div>
    <div id="detailBody"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/tumor-cells.js"></script>
</body>
</html>
