services:
  - type: web
    name: tcm-onco-backend
    env: python
    plan: free
    region: singapore
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: TCM_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false  # 請於 Render 網頁後台手動填入「正式」Neon PostgreSQL 連線字串，不寫入 git 版本控制
      - key: GOOGLE_CLIENT_ID
        sync: false  # 請於 Render 後台手動填入 Google Cloud Console 取得的 Client ID
      - key: GOOGLE_CLIENT_SECRET
        sync: false  # 請於 Render 後台手動填入 Google Cloud Console 取得的 Client Secret
      - key: GOOGLE_REDIRECT_URI
        value: https://tcm-onco-backend.onrender.com/auth/google/callback
      - key: FACEBOOK_CLIENT_ID
        sync: false  # 請於 Render 後台手動填入 Facebook App 的「應用程式編號」
      - key: FACEBOOK_CLIENT_SECRET
        sync: false  # 請於 Render 後台手動填入 Facebook App 的「應用程式密鑰」
      - key: FACEBOOK_REDIRECT_URI
        value: https://tcm-onco-backend.onrender.com/auth/facebook/callback
      - key: FRONTEND_BASE_URL
        value: https://fwc-tcmsp.pages.dev
      # ---- 每日重點新聞模組（v1.34.0）----
      - key: NEWS_COLLECT_SECRET
        sync: false  # 必填。外部排程觸發 POST /news/admin/collect/scheduled 的共享密鑰；未設定時該端點回 503 停用
      - key: ANTHROPIC_API_KEY
        sync: false  # 選填。新聞 AI 中文摘要；未設定會自動降級為規則式摘要，收集流程不中斷
      - key: PUBMED_API_KEY
        sync: false  # 選填。PubMed E-utilities 提高速率上限用
      - key: NEWS_CONTACT_EMAIL
        sync: false  # 選填。爬蟲 User-Agent 附上的聯絡信箱，符合各站 robots 禮儀
    autoDeploy: true

