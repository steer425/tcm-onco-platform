services:
  - type: web
    name: tcm-onco-backend
    env: python
    plan: free
    region: singapore
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: TCM_JWT_SECRET
        generateValue: true
    autoDeploy: true
